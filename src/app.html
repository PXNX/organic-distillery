<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			try {
				if (localStorage.getItem('organic-distillery:age-confirmed') === 'true') {
					document.documentElement.dataset.ageConfirmed = 'true';
				}
				const savedTheme = localStorage.getItem('organic-distillery:theme');
				const theme =
					savedTheme === 'light' || savedTheme === 'dark'
						? savedTheme
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			} catch {}
			// Age gate answers, wired before hydration so the buttons respond immediately.
			document.addEventListener('click', (event) => {
				const button = event.target.closest && event.target.closest('[data-age-answer]');
				const gate = button && button.closest('.age-gate');
				if (!gate) return;
				const answer = button.dataset.ageAnswer;
				if (answer !== 'yes') {
					gate.dataset.state = answer === 'no' ? 'declined' : '';
					const next = gate.querySelector(
						answer === 'no' ? '[data-age-answer="retry"]' : '[data-age-answer="yes"]'
					);
					if (next) next.focus();
					return;
				}
				try {
					localStorage.setItem('organic-distillery:age-confirmed', 'true');
				} catch {}
				const release = () => (document.documentElement.dataset.ageConfirmed = 'true');
				if (matchMedia('(prefers-reduced-motion: reduce)').matches) return release();
				gate.dataset.state = 'leaving';
				setTimeout(release, 450);
			});
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
		<script src="/vendor/app.min.js" defer></script>
	</body>
</html>
