<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			try {
				if (localStorage.getItem('organic-distillery:age-confirmed') === 'true') {
					document.documentElement.dataset.ageConfirmed = 'true';
				}
				const savedTheme = localStorage.getItem('organic-distillery:theme');
				const theme =
					savedTheme === 'light' || savedTheme === 'dark'
						? savedTheme
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
		<script src="/vendor/app.min.js" defer></script>
	</body>
</html>
